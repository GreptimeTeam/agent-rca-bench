<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__REPORT_TITLE__</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17201d;
      --muted: #64706b;
      --line: #d9e0dc;
      --paper: #f7f8f4;
      --card: #ffffff;
      --accent: #0c7259;
      --accent-soft: #def2ea;
      --warm: #f2e9d8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header, main, .report-nav { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    .language-switch { position: sticky; z-index: 10; top: 12px; display: flex; justify-content: flex-end; gap: 6px; width: min(1180px, calc(100% - 40px)); margin: 12px auto -48px; }
    .language-switch a { padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: var(--card); text-decoration: none; }
    .language-switch a[aria-pressed="true"] { color: white; border-color: var(--accent); background: var(--accent); }
    header { padding: 72px 0 30px; }
    h1 { max-width: 820px; margin: 6px 0 12px; font-size: clamp(42px, 8vw, 86px); line-height: .98; letter-spacing: -.055em; }
    h2 { margin: 0 0 14px; font-size: 26px; letter-spacing: -.025em; }
    h3 { margin: 0 0 8px; font-size: 17px; }
    p { margin: 0 0 12px; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .lede { max-width: 760px; color: var(--muted); font-size: 19px; }
    .report-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .report-actions a { padding: 8px 12px; border-radius: 9px; color: white; background: var(--accent); text-decoration: none; }
    .report-actions a + a { color: var(--ink); border: 1px solid var(--line); background: var(--card); }
    .report-nav { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 18px; }
    .report-nav a { flex: 0 0 auto; padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: var(--card); text-decoration: none; }
    .report-nav a:hover { border-color: var(--accent); color: var(--accent); }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 34px; }
    .stat { padding: 18px; border: 1px solid var(--line); background: var(--card); border-radius: 14px; }
    .stat strong { display: block; overflow-wrap: anywhere; color: var(--accent); font-size: 27px; }
    .stat span { color: var(--muted); }
    section, .report-details { scroll-margin-top: 24px; }
    section { padding: 32px 0; border-top: 1px solid var(--line); }
    .overview { padding-top: 22px; border-top: 0; }
    .overview-copy, .mechanism-lede { max-width: 900px; font-size: 18px; }
    .trust-copy { max-width: 900px; margin: 18px 0; padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); }
    .glossary { grid-template-columns: max-content minmax(0, 1fr) max-content minmax(0, 1fr); max-width: 1080px; padding-top: 8px; }
    .attribution { max-width: 900px; margin-top: 24px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
    .attribution a { color: var(--accent); }
    .finding-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .model-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .finding, .model-card { border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 20px; }
    .finding:first-child { background: var(--accent-soft); }
    .finding:last-child { background: var(--warm); }
    .guardrail { margin-top: 18px; padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--card); }
    .model-card h3 { min-height: 48px; font-size: 20px; overflow-wrap: anywhere; }
    .score-intro { max-width: 920px; color: var(--muted); }
    .score-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; color: var(--muted); font-size: 12px; }
    .score-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .score-legend i { width: 12px; height: 12px; border-radius: 3px; }
    .score-leaderboard { display: grid; gap: 12px; margin: 18px 0 22px; }
    .score-entry { padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
    .score-heading { display: grid; grid-template-columns: 36px minmax(0, 1fr) max-content; align-items: center; gap: 10px; margin-bottom: 10px; }
    .score-heading h4 { margin: 0; overflow-wrap: anywhere; font-size: 17px; }
    .score-heading > strong { color: var(--accent); font-size: 22px; font-variant-numeric: tabular-nums; }
    .rank { color: var(--muted); font-weight: 800; }
    .score-bar-row { display: grid; grid-template-columns: 58px minmax(100px, 1fr) 46px; align-items: center; gap: 10px; margin-top: 6px; font-size: 12px; }
    .score-bar-row > span { color: var(--muted); }
    .score-bar-row > strong { text-align: right; font-variant-numeric: tabular-nums; }
    .score-stack { display: flex; width: 100%; height: 16px; overflow: hidden; border-radius: 999px; background: #e6ebe8; }
    .score-segment { display: block; height: 100%; }
    .score-track { height: 10px; overflow: hidden; border-radius: 999px; background: #e6ebe8; }
    .score-fill { display: block; height: 100%; border-radius: inherit; }
    .score-overall { background: var(--accent); }
    .score-location { background: #075f49; }
    .score-root_cause { background: #27a47d; }
    .score-evidence { background: #d79a32; }
    .score-raw { background: #76827d; }
    .score-semantic_graph { background: #27a47d; }
    .dimension-title { margin-top: 30px; }
    .dimension-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 16px 0 26px; }
    .dimension-chart { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
    .dimension-chart h4 { margin: 0 0 12px; font-size: 16px; }
    .dimension-chart h4 span { color: var(--muted); font-weight: 500; }
    .dimension-row { display: grid; grid-template-columns: 24px minmax(90px, 1.2fr) minmax(80px, 2fr) 40px; align-items: center; gap: 7px; margin-top: 8px; font-size: 11px; }
    .dimension-row > strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dimension-row > b { text-align: right; font-variant-numeric: tabular-nums; }
    .dimension-rank { color: var(--muted); font-weight: 750; }
    .dimension-track { height: 8px; overflow: hidden; border-radius: 999px; background: #e6ebe8; }
    .dimension-fill { display: block; height: 100%; border-radius: inherit; }
    .model-metrics-title { margin-top: 34px; }
    .diagnosis-total { margin-bottom: 18px; color: var(--muted); }
    .metric { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); }
    .metric span { color: var(--muted); }
    .metric strong { text-align: right; font-variant-numeric: tabular-nums; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
    .table-wrap table { min-width: 720px; }
    th, td { padding: 11px 12px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    .table-wrap th:first-child, .table-wrap td:first-child { border-left: 0; }
    .table-wrap th:last-child, .table-wrap td:last-child { border-right: 0; }
    .table-wrap thead tr:first-child th { border-top: 0; }
    .table-wrap tbody tr:last-child td { border-bottom: 0; }
    th { background: #edf1ee; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
    code { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    li { margin: 6px 0; }
    .small { margin-top: 10px; color: var(--muted); font-size: 13px; }
    .section-lede { max-width: 850px; color: var(--muted); }
    .report-details { margin: 22px 0; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
    .report-details > summary { padding: 15px 18px; color: var(--accent); font-weight: 750; cursor: pointer; }
    .report-details[open] > summary { border-bottom: 1px solid var(--line); }
    .details-body { padding: 18px; }
    .details-body h3 { margin-top: 28px; }
    .details-body h3:first-child { margin-top: 0; }
    .mechanism-grid { margin-top: 18px; }
    .mechanism-grid table { min-width: 780px; }
    .mechanism-grid th:not(:first-child), .mechanism-grid td:not(:first-child) { text-align: center; }
    .effect-cell { font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .effect-better { color: #075f49; background: #d9f0e7; }
    .effect-worse { color: #8a3c24; background: #f4dfd7; }
    .effect-tied { color: var(--muted); background: #edf1ee; }
    .effect-na { color: var(--muted); background: #f7f8f4; }
    .cost-total { padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--card); }
    footer { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 24px 0 60px; color: var(--muted); }
    @media (max-width: 860px) {
      .stat-grid, .finding-grid, .model-grid, .dimension-grid, .split { grid-template-columns: 1fr; }
      .glossary { grid-template-columns: max-content minmax(0, 1fr); }
      header { padding-top: 42px; }
    }
    @media print {
      body { background: white; }
      header, main, footer, .report-nav { width: 100%; }
      .language-switch, .report-nav { display: none; }
      .finding, .model-card, .score-entry, .dimension-chart, .stat { break-inside: avoid; }
      .report-details > summary { display: none; }
      .report-details:not([open]) > .details-body { display: block; }
    }
  </style>
</head>
<body>
  __REPORT_BODY__
  <footer><span data-footer-language="en">Generated deterministically from the two sanitized measurement artifacts. No provider payloads or raw telemetry are embedded.</span><span data-footer-language="zh" hidden>本报告由两份脱敏测量工件确定性生成，不包含 provider payload 或原始遥测行。</span></footer>
  <script type="application/json" id="semantic-rca-report">__REPORT_DATA__</script>
  <script>
    (() => {
      const languages = new Set(["en", "zh"]);
      const parseHash = () => {
        const match = window.location.hash.match(/^#(en|zh)(?:-(.+))?$/);
        return match ? { language: match[1], section: match[2] || null } : null;
      };
      const setLanguage = (language, section = null) => {
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
        document.querySelectorAll("[data-report-language]").forEach((node) => {
          node.hidden = node.dataset.reportLanguage !== language;
        });
        document.querySelectorAll("[data-footer-language]").forEach((node) => {
          node.hidden = node.dataset.footerLanguage !== language;
        });
        document.querySelectorAll("[data-language-button]").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.languageButton === language));
        });
        if (section) {
          window.requestAnimationFrame(() => {
            document.getElementById(`${language}-${section}`)?.scrollIntoView();
          });
        }
      };
      const applyHash = () => {
        const state = parseHash();
        setLanguage(state?.language || "en", state?.section);
      };
      document.querySelectorAll("[data-language-button]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.preventDefault();
          const language = button.dataset.languageButton;
          if (!languages.has(language)) return;
          const section = parseHash()?.section;
          const nextHash = `#${language}${section ? `-${section}` : ""}`;
          if (window.location.hash === nextHash) setLanguage(language, section);
          else window.location.hash = nextHash;
        });
      });
      window.addEventListener("hashchange", applyHash);
      applyHash();
    })();
  </script>
</body>
</html>
