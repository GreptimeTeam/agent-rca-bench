[project]
name = "semantic-rca-bench"
version = "0.1.0"
description = "Paired RCA evaluation for GreptimeDB table semantics and semantic graph"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "anthropic>=0.64.0",
  "anyio>=4.0.0",
  "httpx[socks]>=0.28.0",
  "huggingface-hub>=0.34.0",
  "mcp>=1.27.0,<2",
  "opentelemetry-proto>=1.36.0",
  "protobuf>=5.29.0",
  "pyarrow>=20.0.0",
  "pydantic>=2.11.0",
  "python-snappy>=0.7.3",
  "sqlglot>=27.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[project.scripts]
semantic-rca = "semantic_rca_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_rca_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
