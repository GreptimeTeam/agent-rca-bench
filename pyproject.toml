[project]
name = "agent-rca-bench"
version = "0.1.0"
description = "Paired benchmark measuring how the observability interface behind an LLM agent changes root cause analysis"
readme = "README.md"
authors = [
  { name = "Dennis Zhuang", email = "xzhuang@greptime.com" },
]
maintainers = [
  { name = "Greptime", email = "info@greptime.com" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
keywords = [
  "benchmark",
  "root-cause-analysis",
  "observability",
  "llm-agent",
  "opentelemetry",
  "greptimedb",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

dependencies = [
  "anthropic>=0.64.0",
  "anyio>=4.0.0",
  "httpx[socks]>=0.28.0",
  "huggingface-hub>=0.34.0",
  "mcp>=1.27.0,<2",
  "opentelemetry-proto>=1.36.0",
  "openai>=2.0.0",
  "protobuf>=5.29.0",
  "pyarrow>=20.0.0",
  "pydantic>=2.11.0",
  "python-snappy>=0.7.3",
  "sqlglot>=27.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/GreptimeTeam/agent-rca-bench"
Documentation = "https://github.com/GreptimeTeam/agent-rca-bench#readme"
Report = "https://semantic-rca.greptime.com"
Repository = "https://github.com/GreptimeTeam/agent-rca-bench"
Issues = "https://github.com/GreptimeTeam/agent-rca-bench/issues"
Changelog = "https://github.com/GreptimeTeam/agent-rca-bench/blob/main/CHANGELOG.md"

[project.scripts]
agent-rca = "agent_rca_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_rca_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
