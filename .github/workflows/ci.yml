name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv lock --check
      - run: uv build
      - run: sha256sum --check artifacts/measurement/semantic-rca-v32-SHA256SUMS
      - name: Reproduce the fixed measurement summary
        run: |
          summary=$(mktemp)
          uv run python -m semantic_rca_bench.measurement_summary \
            --output "$summary"
          cmp fixtures/measurement/results-summary.json "$summary"
      - name: Reproduce the public report
        run: |
          output_dir=$(mktemp -d)
          uv run semantic-rca formal-suite-report \
            --micro-artifact artifacts/measurement/semantic-rca-v32-micro.json \
            --transfer-artifact artifacts/measurement/semantic-rca-v32-transfer.json \
            --output-json "$output_dir/semantic-rca.json" \
            --output-html "$output_dir/semantic-rca.html"
          cmp artifacts/measurement/semantic-rca-v32.json \
            "$output_dir/semantic-rca.json"
          cmp artifacts/measurement/semantic-rca-v32.html \
            "$output_dir/semantic-rca.html"
